<head>

  <meta charset="UTF-8">

  <style>
    :root {
      --brand: #dc2626;
      --brand-d: #991b1b;
      --brand-soft: #fef2f2;
      --brand-ring: rgba(220, 38, 38, .15);
      --ink: #0f1117;
      --ink2: #2d3240;
      --muted: #6c7389;
      --bg: #f5f6fa;
      --card: #ffffff;
      --stroke: #e4e6ef;
      --row-hover: #fef2f2;
      --th: #f8f9fc;
      --green: #16a34a;
      --green-bg: #f0fdf4;
      --orange: #d97706;
      --orange-bg: #fff7ed;
      --blue: #2563eb;
      --blue-bg: #eff6ff;
      --purple: #7c3aed;
      --purple-bg: #f5f3ff;
      --shadow: 0 2px 16px rgba(15, 17, 23, .07);
      --shadow-lg: 0 8px 32px rgba(15, 17, 23, .10);
      --radius: 14px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { height: 100% }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      padding-top: 80px;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 70px;
    }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-d) 100%);
      border-radius: 24px;
      padding: 36px 32px;
      margin-bottom: 28px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 24px;
      background: radial-gradient(circle at 80% 50%, rgba(255, 255, 255, .06) 0%, transparent 60%);
      pointer-events: none;
    }

    .hero h1 {
      font-family: 'Lexend', sans-serif;
      font-weight: 800;
      font-size: clamp(22px, 4vw, 30px);
      margin-bottom: 10px;
      letter-spacing: -0.5px;
      position: relative;
    }

    .hero p {
      opacity: .9;
      font-size: 15px;
      line-height: 1.6;
      position: relative;
      max-width: 640px;
    }

    .hero .data-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
      backdrop-filter: blur(4px);
      position: relative;
    }

    .hero .data-badge::before {
      content: '';
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse-dot 2s ease infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Stats */
    .stats-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink2);
    }

    .sp-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    /* Filter tabs */
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink2);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .filter-tab {
      padding: 8px 18px;
      border-radius: 100px;
      border: 1.5px solid var(--stroke);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      background: var(--card);
      color: var(--muted);
      transition: 0.2s;
    }

    .filter-tab:hover { border-color: var(--brand-ring); }

    .filter-tab.active {
      background: var(--brand-soft);
      border-color: var(--brand);
      color: var(--brand);
    }

    /* Search */
    .search-wrap {
      position: relative;
      margin-bottom: 20px;
    }

    .search-wrap input {
      width: 100%;
      padding: 14px 20px 14px 48px;
      border: 1.5px solid var(--stroke);
      border-radius: 14px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 500;
      outline: none;
      background: var(--card);
      transition: all 0.2s;
    }

    .search-wrap input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 4px var(--brand-ring);
    }

    .search-wrap input::placeholder { color: var(--muted); }

    .search-wrap svg {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    /* Table */
    .table-card {
      background: var(--card);
      border: 1.5px solid var(--stroke);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }

    .table-scroll {
      overflow-x: auto;
    }

    .cutoff-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .cutoff-table th {
      background: var(--th);
      padding: 14px 16px;
      text-align: center;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      border-bottom: 2px solid var(--stroke);
      white-space: nowrap;
      font-weight: 800;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .cutoff-table th:first-child,
    .cutoff-table th:nth-child(2),
    .cutoff-table th:nth-child(3) {
      text-align: left;
    }

    .cutoff-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--stroke);
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .cutoff-table td:first-child,
    .cutoff-table td:nth-child(2),
    .cutoff-table td:nth-child(3) {
      text-align: left;
    }

    .cutoff-table tr:last-child td { border-bottom: none; }
    .cutoff-table tr:hover td { background: var(--row-hover); }

    .cutoff-table .branch-cell {
      font-weight: 700;
      color: var(--ink);
      max-width: 320px;
      font-size: 13px;
    }

    .cutoff-table .sr-cell {
      font-weight: 700;
      color: var(--muted);
      font-size: 12px;
      width: 40px;
    }

    .campus-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    .tag-manipal { background: var(--green-bg); color: var(--green); }
    .tag-bengaluru { background: var(--blue-bg); color: var(--blue); }
    .tag-jaipur { background: var(--orange-bg); color: var(--orange); }
    .tag-sikkim { background: var(--purple-bg); color: var(--purple); }

    .rank-val {
      font-weight: 700;
      color: var(--ink);
    }

    .rank-val.empty {
      color: var(--muted);
      font-weight: 400;
      font-size: 11px;
    }

    /* Empty */
    .empty-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .empty-state h3 {
      font-family: 'Lexend', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: var(--ink2);
      margin-bottom: 6px;
    }

    .empty-state p {
      font-size: 14px;
      line-height: 1.6;
      max-width: 360px;
      margin: 0 auto;
    }

    /* Loading */
    .loading-state {
      text-align: center;
      padding: 60px 24px;
      color: var(--muted);
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--stroke);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg) } }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(8px) }
      to { opacity: 1; transform: translateY(0) }
    }

    .table-card { animation: cardIn .25s ease both; }

    /* Responsive */
    @media(max-width:640px) {
      .wrap { padding: 16px 12px 50px }
      .hero { padding: 22px 18px; border-radius: 18px; }
      .hero h1 { font-size: 20px; }
      .cutoff-table th { padding: 10px 8px; font-size: 10px; }
      .cutoff-table td { padding: 10px 8px; font-size: 12px; }
      .campus-tag { font-size: 10px; padding: 2px 6px; }
    }
  </style>
</head>

<body>

  <div id="toolArea">
    <div class="wrap">

      <div class="hero">
        <h1>Manipal MIT (MET) Cutoffs</h1>
        <p>Complete MET 2025 cutoff ranks across all Manipal University campuses — MIT Manipal, MIT Bengaluru, MUJ Jaipur, and SMIT Sikkim.</p>
        <div class="data-badge">Based on MET 2025 Cutoffs — Rounds 1 to 4</div>
      </div>

      <div class="stats-row" id="statsRow"></div>

      <div class="search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search branch name..." oninput="renderTable()" autocomplete="off">
      </div>

      <div class="filter-row" id="filterRow"></div>

      <div id="tableContainer">
        <div class="loading-state"><div class="spinner"></div><p>Loading Manipal cutoff data...</p></div>
      </div>

    </div>
  </div>

  <script>
    'use strict';

    const DATA_FILE = 'MANIPAL/MANIPAL_CUTOFF.json';
    const DATA_KEY = 'MANIPAL_CUTOFF';
    const ROUND_FIELDS = ['Round 1', 'Round 2', 'Round 3', 'Round 4'];

    let ALL_DATA = [];
    let CAMPUSES = [];
    let CAMPUS_FILTER = 'all';

    function esc(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

    function parseRank(val) {
      if (!val || typeof val !== 'string') return null;
      const trimmed = val.trim();
      if (trimmed === '–' || trimmed === '-' || trimmed === '') return null;
      const cleaned = trimmed.replace(/,/g, '');
      const num = parseInt(cleaned, 10);
      return isNaN(num) ? null : num;
    }

    function cleanCampusName(raw) {
      if (!raw) return '';
      const parts = raw.split('\n');
      return parts[0].replace(/\s+/g, ' ').trim();
    }

    function getCampusTag(campus) {
      const c = campus.toLowerCase();
      if (c.includes('manipal') && !c.includes('bengaluru') && !c.includes('jaipur') && !c.includes('sikkim')) return { cls: 'tag-manipal', short: 'MIT Manipal' };
      if (c.includes('bengaluru')) return { cls: 'tag-bengaluru', short: 'MIT Bengaluru' };
      if (c.includes('jaipur')) return { cls: 'tag-jaipur', short: 'MUJ Jaipur' };
      if (c.includes('sikkim') || c.includes('smit')) return { cls: 'tag-sikkim', short: 'SMIT Sikkim' };
      return { cls: 'tag-manipal', short: campus };
    }

    function renderStats() {
      const sr = document.getElementById('statsRow');
      let totalCutoffs = 0;
      const branchSet = new Set();
      ALL_DATA.forEach(entry => {
        branchSet.add(entry.branch);
        entry.rounds.forEach(r => { if (r !== null) totalCutoffs++; });
      });

      sr.innerHTML =
        '<div class="stat-pill"><span class="sp-dot" style="background:var(--brand)"></span>' + totalCutoffs + ' cutoff entries</div>' +
        '<div class="stat-pill"><span class="sp-dot" style="background:var(--green)"></span>' + branchSet.size + ' branches</div>' +
        '<div class="stat-pill"><span class="sp-dot" style="background:var(--blue)"></span>' + CAMPUSES.length + ' campuses</div>' +
        '<div class="stat-pill"><span class="sp-dot" style="background:var(--orange)"></span>4 rounds</div>';
    }

    function renderFilters() {
      const row = document.getElementById('filterRow');
      let html = '<span class="filter-label">Campus:</span>';
      html += '<div class="filter-tab ' + (CAMPUS_FILTER === 'all' ? 'active' : '') + '" onclick="setCampusFilter(\'all\')">All</div>';
      CAMPUSES.forEach(campus => {
        const tag = getCampusTag(campus);
        html += '<div class="filter-tab ' + (CAMPUS_FILTER === campus ? 'active' : '') + '" onclick="setCampusFilter(\'' + esc(campus).replace(/'/g, "\\'") + '\')">' + tag.short + '</div>';
      });
      row.innerHTML = html;
    }

    function setCampusFilter(campus) {
      CAMPUS_FILTER = campus;
      renderFilters();
      renderTable();
    }

    function renderTable() {
      const container = document.getElementById('tableContainer');
      const query = (document.getElementById('searchInput').value || '').trim().toLowerCase();

      // Filter data
      let filtered = ALL_DATA;
      if (CAMPUS_FILTER !== 'all') {
        filtered = filtered.filter(e => e.campus === CAMPUS_FILTER);
      }
      if (query) {
        filtered = filtered.filter(e => e.branch.toLowerCase().includes(query) || e.campus.toLowerCase().includes(query));
      }

      if (!filtered.length) {
        container.innerHTML = '<div class="empty-state"><div style="font-size:48px;margin-bottom:14px;opacity:0.3">📋</div><h3>No results found</h3><p>Try a different search or campus filter.</p></div>';
        return;
      }

      let html = '<div class="table-card"><div class="table-scroll">';
      html += '<table class="cutoff-table">';
      html += '<thead><tr>';
      html += '<th style="width:40px">#</th>';
      html += '<th style="min-width:120px">Campus</th>';
      html += '<th style="min-width:240px">Branch</th>';
      html += '<th>Round 1</th>';
      html += '<th>Round 2</th>';
      html += '<th>Round 3</th>';
      html += '<th>Round 4</th>';
      html += '</tr></thead>';
      html += '<tbody>';

      filtered.forEach((entry, idx) => {
        const tag = getCampusTag(entry.campus);
        html += '<tr>';
        html += '<td class="sr-cell">' + entry.srNo + '</td>';
        html += '<td><span class="campus-tag ' + tag.cls + '">' + tag.short + '</span></td>';
        html += '<td class="branch-cell">' + esc(entry.branch) + '</td>';

        entry.rounds.forEach(val => {
          if (val !== null) {
            html += '<td class="rank-val">' + val.toLocaleString('en-IN') + '</td>';
          } else {
            html += '<td class="rank-val empty">—</td>';
          }
        });

        html += '</tr>';
      });

      html += '</tbody></table></div></div>';
      container.innerHTML = html;
    }

    async function loadData() {
      try {
        const res = await fetch(DATA_FILE);
        if (!res.ok) throw new Error('Failed to load data');
        const json = await res.json();
        const rows = json[DATA_KEY] || [];

        const campusSet = new Set();

        rows.forEach(row => {
          const campus = cleanCampusName(row['Campus'] || '');
          const branch = (row['Branch'] || '').replace(/\s+/g, ' ').trim();
          const srNo = row['Sr. No'] || '';
          if (!campus || !branch) return;

          const rounds = ROUND_FIELDS.map(f => parseRank(row[f]));

          ALL_DATA.push({ srNo, campus, branch, rounds });
          campusSet.add(campus);
        });

        // Sort campuses: MIT Manipal first, then Bengaluru, Jaipur, Sikkim
        const campusOrder = ['MIT Manipal', 'MIT Bengaluru', 'MUJ Jaipur', 'SMIT Sikkim'];
        CAMPUSES = [...campusSet].sort((a, b) => {
          const ai = campusOrder.findIndex(c => a.includes(c.split(' ').pop()));
          const bi = campusOrder.findIndex(c => b.includes(c.split(' ').pop()));
          return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
        });

        renderStats();
        renderFilters();
        renderTable();
      } catch (err) {
        console.error('Load error:', err);
        document.getElementById('tableContainer').innerHTML =
          '<div class="empty-state"><h3>Failed to load data</h3><p>Please refresh the page and try again.</p></div>';
      }
    }

    function boot() {
      if (!initAuth({ requireLogin: true, toolContainerId: 'toolArea' })) return;
      loadData();
    }

    window.setCampusFilter = setCampusFilter;

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  </script>
</body>

</html>
