  <meta charset="UTF-8">

  <style>
    :root {
      --brand: #dc2626;
      --brand-soft: #fef2f2;
      --ink: #111827;
      --muted: #6b7280;
      --bg: #f4f6fb;
      --card: #ffffff;
      --stroke: #e5e7eb;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      overflow-x: hidden;
      width: 100%;

      font-family: 'DM Sans', sans-serif;

      max-width: 600px;

    .page-hero {

    label {

    }

    label:first-child {
      margin-top: 0;
    }

    input,
    select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--stroke);
      border-radius: 12px;
      font-family: inherit;

      outline: none;

    }

    input:focus,
    select:focus {
      border-color: var(--brand);

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--brand);
      color: #fff;
      border: none;

      from {
        opacity: 0;

      }

      to {
        opacity: 1;
        transform: translateY(0);

    }

    .res-label {

    .info-note {
      background: #fef2f2;
      border: 1px solid #fee2e2;
      color: #991b1b;
      padding: 16px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 24px;
      line-height: 1.5;
      text-align: left;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
    }

    .info-note svg {
      color: #dc2626;
      flex-shrink: 0;
      margin-top: 2px;
    }

<body>
  <div class="wrap">
    <div id="toolArea">
      <div class="page-hero">
        <h1>Marks vs Percentile</h1>
        <p>Estimate your MHT-CET percentile based on historical trends and shift difficulty levels.</p>
      </div>

      <div class="card">
        <label>Total Marks (Out of 200)</label>
        <input type="number" id="inMarks" placeholder="e.g. 145" min="0" max="200">

        <label>Shift Difficulty</label>
        <select id="inDifficulty">
          <option value="moderate">Moderate Shift</option>
          <option value="easy">Easy Shift</option>
          <option value="hard">Hard Shift</option>
        </select>

        <button class="btn" onclick="predict()">Calculate Percentile</button>
      </div>

      <div class="result-card" id="resultCard">
        <div class="res-label">Estimated Percentile</div>
        <div class="res-val" id="resPercentile">—</div>
        <div class="res-range" id="resRange"></div>
        <a id="rankLink" href="cet_rank.html" class="btn"
          style="margin-top:24px;text-decoration:none;display:block">Predict Rank Now →</a>
      </div>

      <div class="info-note">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="12" cy="12" r="10" />
          <line x1="12" y1="8" x2="12" y2="12" />
          <line x1="12" y1="16" x2="12.01" y2="16" />
        </svg>
        <p>Your percentile depends on the number of students in that shift and the difficulty level of the shift varies.</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase_config.js"></script>
  <script src="shared_auth.js"></script>
  <script>
    'use strict';

    // High-precision MHT-CET 2026 Shift-wise Marks vs Percentile Data
    const MHT_CET_2026_DATA = {
      hard: [
        { min: 170, max: 200, lowPct: 99.95, highPct: 100 },
        { min: 160, max: 170, lowPct: 99.80, highPct: 99.95 },
        { min: 150, max: 160, lowPct: 99.50, highPct: 99.80 },
        { min: 140, max: 150, lowPct: 99.10, highPct: 99.50 },
        { min: 130, max: 140, lowPct: 98.80, highPct: 99.10 },
        { min: 120, max: 130, lowPct: 98.00, highPct: 98.80 },
        { min: 110, max: 120, lowPct: 96.70, highPct: 98.00 },
        { min: 100, max: 110, lowPct: 95.50, highPct: 96.70 },
        { min: 90, max: 100, lowPct: 92.00, highPct: 95.50 },
        { min: 85, max: 90, lowPct: 88.00, highPct: 92.00 },
        { min: 80, max: 85, lowPct: 84.00, highPct: 88.00 },
        { min: 75, max: 80, lowPct: 80.00, highPct: 84.00 },
        { min: 70, max: 75, lowPct: 76.00, highPct: 80.00 },
        { min: 60, max: 70, lowPct: 67.00, highPct: 76.00 },
        { min: 0, max: 60, lowPct: null, highPct: null, unpredictable: true }
      ],
      moderate: [
        { min: 170, max: 200, lowPct: 99.90, highPct: 100 },
        { min: 160, max: 170, lowPct: 99.60, highPct: 99.90 },
        { min: 150, max: 160, lowPct: 99.30, highPct: 99.60 },
        { min: 140, max: 150, lowPct: 98.90, highPct: 99.30 },
        { min: 130, max: 140, lowPct: 98.50, highPct: 98.90 },
        { min: 120, max: 130, lowPct: 97.40, highPct: 98.50 },
        { min: 110, max: 120, lowPct: 96.50, highPct: 97.40 },
        { min: 100, max: 110, lowPct: 94.10, highPct: 96.50 },
        { min: 90, max: 100, lowPct: 89.00, highPct: 94.10 },
        { min: 85, max: 90, lowPct: 86.00, highPct: 89.00 },
        { min: 80, max: 85, lowPct: 82.00, highPct: 86.00 },
        { min: 75, max: 80, lowPct: 77.00, highPct: 82.00 },
        { min: 70, max: 75, lowPct: 72.00, highPct: 77.00 },
        { min: 60, max: 70, lowPct: 64.00, highPct: 72.00 },
        { min: 0, max: 60, lowPct: null, highPct: null, unpredictable: true }
      ],
      easy: [
        { min: 170, max: 200, lowPct: 99.90, highPct: 100 },
        { min: 160, max: 170, lowPct: 99.50, highPct: 99.90 },
        { min: 150, max: 160, lowPct: 99.10, highPct: 99.50 },
        { min: 140, max: 150, lowPct: 98.50, highPct: 99.10 },
        { min: 130, max: 140, lowPct: 97.80, highPct: 98.50 },
        { min: 120, max: 130, lowPct: 96.50, highPct: 97.80 },
        { min: 110, max: 120, lowPct: 94.80, highPct: 96.50 },
        { min: 100, max: 110, lowPct: 91.50, highPct: 94.80 },
        { min: 90, max: 100, lowPct: 87.00, highPct: 91.50 },
        { min: 85, max: 90, lowPct: 83.00, highPct: 87.00 },
        { min: 80, max: 85, lowPct: 79.00, highPct: 83.00 },
        { min: 75, max: 80, lowPct: 74.00, highPct: 79.00 },
        { min: 70, max: 75, lowPct: 69.00, highPct: 74.00 },
        { min: 60, max: 70, lowPct: 60.00, highPct: 69.00 },
        { min: 0, max: 60, lowPct: null, highPct: null, unpredictable: true }
      ]
    };

    function predict() {
      var btn = document.querySelector('.card .btn');
      var marks = parseFloat(document.getElementById('inMarks').value);
      var diff = document.getElementById('inDifficulty').value;
      if (isNaN(marks) || marks < 0 || marks > 200) return alert('Enter valid marks (0-200)');

      var originalText = btn.textContent;
      btn.textContent = 'Calculating...';
      btn.disabled = true;

      setTimeout(function() {
        var shiftData = MHT_CET_2026_DATA[diff];
        var resCard = document.getElementById('resultCard');
        resCard.classList.remove('show');

        setTimeout(function() {
          var resPercentile = document.getElementById('resPercentile');
          var resRange = document.getElementById('resRange');
          var rankLink = document.getElementById('rankLink');

          if (marks < 60) {
            resPercentile.textContent = 'Unpredictable';
            resPercentile.style.fontSize = '36px';
            resRange.innerHTML = '<span style="color: #dc2626; font-weight: 600;">Percentile is unpredictable for marks below 60 due to high score clustering.</span>';
            rankLink.style.display = 'none';
          } else if (marks < 86) {
            var row = shiftData.find(r => marks >= r.min && marks < r.max);
            if (row) {
              resPercentile.style.fontSize = '36px';
              resPercentile.textContent = row.lowPct.toFixed(2) + '% - ' + row.highPct.toFixed(2) + '%';
              resRange.textContent = 'Expected Range for Marks ' + row.min + '-' + row.max + ' (' + (diff.charAt(0).toUpperCase() + diff.slice(1)) + ' Shift)';
              
              var avgPct = ((row.lowPct + row.highPct) / 2).toFixed(2);
              rankLink.href = 'cet_rank.html?percentile=' + avgPct;
              rankLink.style.display = 'block';
            }
          } else {
            var row = shiftData.find(r => marks >= r.min && marks <= r.max);
            if (row) {
              resPercentile.style.fontSize = '48px';
              var pct = row.lowPct + ((marks - row.min) / (row.max - row.min)) * (row.highPct - row.lowPct);
              pct = Math.min(100.0, Math.max(0.0, pct));
              var resPct = pct.toFixed(2);
              
              resPercentile.textContent = resPct + '%';
              resRange.textContent = 'Expected Range: ' + row.lowPct.toFixed(2) + '% — ' + row.highPct.toFixed(2) + '% (' + (diff.charAt(0).toUpperCase() + diff.slice(1)) + ' Shift)';
              
              rankLink.href = 'cet_rank.html?percentile=' + resPct;
              rankLink.style.display = 'block';
            }
          }

          resCard.classList.add('show');
          resCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          
          btn.textContent = originalText;
          btn.disabled = false;
        }, 100);
      }, 300);
    }

    function boot() {
      if (!initAuth({ requireLogin: true, toolContainerId: 'toolArea' })) return;
    }

    window.predict = predict;

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
    else boot();
  </script>
</body>

</html>
