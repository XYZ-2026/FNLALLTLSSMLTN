# ── Headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "frame-ancestors 'self' https://*.collegesimplified.in https://*.conceptsimplified.in"

[[headers]]
  for = "/COMMUNITY/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/CUTOFFS 2026/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
